al" text-anchor="start">Sistema externo en vivo</text><rect x="1504" y="890" width="34" height="20" rx="4" fill="#f2f2f2" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3"/><text x="1548" y="905.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#222" font-weight="normal" text-anchor="start">Sistema externo simulado</text><text x="1490" y="1000.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555" font-weight="normal" text-anchor="start">G2 Despacho no se integra con Retail:</text><text x="1490" y="1016.2" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555" font-weight="normal" text-anchor="start">el retiro en tienda se resuelve con G5</text><text x="1490" y="1032.5" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555" font-weight="normal" text-anchor="start">(contrato §4.4).</text></svg>