<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1180" viewBox="0 0 1840 1180"><defs><marker id="fin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="ini" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs><rect width="1840" height="1180" fill="#ffffff"/><text x="920.0" y="44" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1f2d3d" text-anchor="middle">Diagrama de Contenedores (C4 · nivel 2) — Canal Retail (G4)</text><text x="920.0" y="72" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#555" text-anchor="middle">Hito 4 · Semana 11 · conexiones reales con Ventas (G5) y Seguridad (G7)</text><circle cx="200.0" cy="122" r="30" fill="#08427b"/><rect x="60" y="150" width="280" height="120" rx="30" fill="#08427b" stroke="#08427b" stroke-width="2"/><text x="200.0" y="180.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">Personal de tienda</text><text x="200.0" y="200.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" font-weight="normal" text-anchor="middle" font-style="italic">[Persona]</text><text x="200.0" y="226.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" font-weight="normal" text-anchor="middle">Vendedor y supervisor</text><text x="200.0" y="242.2" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" font-weight="normal" text-anchor="middle">en el mostrador</text><rect x="400" y="360" width="920" height="560" rx="12" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="10 6"/><text x="416" y="886.0" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#444" font-weight="bold" text-anchor="start">Canal Retail (G4)</text><text x="416" y="906.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start" font-style="italic">[Sistema: punto de venta en mostrador]</text><rect x="450" y="440" width="320" height="150" rx="10" fill="#438dd5" stroke="#438dd5" stroke-width="2"/><text x="610.0" y="470.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">Web App POS</text><text x="610.0" y="490.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" font-weight="normal" text-anchor="middle" font-style="italic">[Contenedor: React 19 + TypeScript + Vite]</text><text x="610.0" y="516.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" font-weight="normal" text-anchor="middle">SPA del mostrador: venta, cobro,</text><text x="610.0" y="532.2" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" font-weight="normal" text-anchor="middle">caja, pickup, historial y cambios</text><rect x="940" y="440" width="330" height="150" rx="10" fill="#438dd5" stroke="#438dd5" stroke-width="2"/><text x="1105.0" y="470.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">ms-retail</text><text x="1105.0" y="490.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" font-weight="normal" text-anchor="middle" font-style="italic">[Contenedor: Java 21 + Spring Boot 3.5]</text><text x="1105.0" y="516.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" font-weight="normal" text-anchor="middle">API REST /api/v1/retail/*</text><text x="1105.0" y="532.2" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" font-weight="normal" text-anchor="middle">Reglas de mostrador e integraciones</text><path d="M940,714 A165.0,14 0 0 1 1270,714 V826 A165.0,14 0 0 1 940,826 Z" fill="#438dd5" stroke="#438dd5" stroke-width="2"/><ellipse cx="1105.0" cy="714" rx="165.0" ry="14" fill="none" stroke="#2e6aa8" stroke-width="2"/><text x="1105.0" y="748.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">BD_Retail</text><text x="1105.0" y="768.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" font-weight="normal" text-anchor="middle" font-style="italic">[Contenedor: PostgreSQL en Supabase]</text><text x="1105.0" y="792.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" font-weight="normal" text-anchor="middle">Turnos, ventas, comprobantes,</text><text x="1105.0" y="808.2" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" font-weight="normal" text-anchor="middle">personal de tienda (RET_*)</text><rect x="560" y="110" width="380" height="130" rx="10" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="2"/><text x="750.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">Seguridad y Usuarios (G7)</text><text x="750.0" y="160.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" font-weight="normal" text-anchor="middle" font-style="italic">[Sistema externo · Render]</text><text x="750.0" y="186.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" font-weight="normal" text-anchor="middle">Login con MFA, emite JWT (RS256),</text><text x="750.0" y="202.2" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" font-weight="normal" text-anchor="middle">JWKS y tokens de servicio</text><rect x="1450" y="440" width="340" height="150" rx="10" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="2"/><text x="1620.0" y="470.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">Ventas y Postventa (G5)</text><text x="1620.0" y="490.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" font-weight="normal" text-anchor="middle" font-style="italic">[Sistema externo · Render]</text><text x="1620.0" y="516.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" font-weight="normal" text-anchor="middle">Dueño del pedido y su estado;</text><text x="1620.0" y="532.2" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" font-weight="normal" text-anchor="middle">bandeja pickup y entrega</text><rect x="1450" y="140" width="340" height="130" rx="10" fill="#f2f2f2" stroke="#777" stroke-width="2" stroke-dasharray="8 5"/><text x="1620.0" y="170.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333" font-weight="bold" text-anchor="middle">Productos y Ofertas (G6)</text><text x="1620.0" y="190.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333" font-weight="normal" text-anchor="middle" font-style="italic">[Sistema externo · simulado]</text><text x="1620.0" y="216.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333" font-weight="normal" text-anchor="middle">Catálogo y precios: en el Hito 4</text><text x="1620.0" y="232.2" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333" font-weight="normal" text-anchor="middle">se usa el mock interno de ms-retail</text><rect x="450" y="1010" width="320" height="110" rx="10" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="2"/><text x="610.0" y="1040.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">Impresora de tickets</text><text x="610.0" y="1060.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" font-weight="normal" text-anchor="middle" font-style="italic">[Hardware de mostrador]</text><text x="610.0" y="1086.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" font-weight="normal" text-anchor="middle">Boleta / ticket térmico</text><path d="M300,270 L500,440" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#fin)"/><rect x="231.3" y="374.0" width="197.4" height="42" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/><text x="330" y="392.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222" font-weight="normal" text-anchor="middle">Usa el POS en el navegador</text><text x="330" y="408.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222" font-weight="normal" text-anchor="middle">[HTTPS]</text><path d="M560,440 L640,240" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#fin)"/><rect x="578.5" y="291.0" width="162.9" height="58" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/><text x="660" y="309.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222" font-weight="normal" text-anchor="middle">Inicia sesión con MFA</text><text x="660" y="325.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222" font-weight="normal" text-anchor="middle">y obtiene el JWT</text><text x="660" y="341.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222" font-weight="normal" text-anchor="middle">[HTTPS / REST]</text><path d="M770,515 L940,515" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#fin)"/><rect x="770.0" y="449.0" width="170.0" height="42" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/><text x="855" y="467.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222" font-weight="normal" text-anchor="middle">Consume la API con JWT</text><text x="855" y="483.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222" font-weight="normal" text-anchor="middle">[HTTPS / REST · JSON]</text><path d="M1040,440 L860,240" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#fin)"/><rect x="843.0" y="283.0" width="294.0" height="74" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/><text x="990" y="301.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222" font-weight="normal" text-anchor="middle">Valida el JWT con JWKS (RS256)</text><text x="990" y="317.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222" font-weight="normal" text-anchor="middle">y pide token de servicio</text><text x="990" y="333.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222" font-weight="normal" text-anchor="middle">client_credentials (audience api-ventas)</text><text x="990" y="349.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222" font-weight="normal" text-anchor="middle">[HTTPS]</text><path d="M1270,515 L1450,515" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#fin)"/><rect x="1251.0" y="578.0" width="218.1" height="74" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/><text x="1360" y="596.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222" font-weight="normal" text-anchor="middle">Crea pedidos IN_STORE (F4/F5)</text><text x="1360" y="612.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222" font-weight="normal" text-anchor="middle">Bandeja y entrega pickup (F7)</text><text x="1360" y="628.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222" font-weight="normal" text-anchor="middle">Bearer G7 · Idempotency-Key</text><text x="1360" y="644.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222" font-weight="normal" text-anchor="middle">[HTTPS / REST]</text><path d="M1230,440 L1450,230" fill="none" stroke="#555555" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#fin)"/><rect x="1246.7" y="309.0" width="176.7" height="42" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/><text x="1335" y="327.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222" font-weight="normal" text-anchor="middle">Lecturas de catálogo</text><text x="1335" y="343.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222" font-weight="normal" text-anchor="middle">[simulado: perfil mock]</text><path d="M1105,590 L1105,700" fill="none" stroke